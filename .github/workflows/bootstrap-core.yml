name: Bootstrap verified core

on:
  push:
    paths:
      - .github/workflows/bootstrap-core.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch verified core
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/benclawbot/AI-Harness/6f2a9900da22ab0429056ba5f0718f7a21f616e1/outcome_os.py \
            --output outcome_os.py
          echo "63294c0cd561d704e2220b07afdb291d43f6b641b6ea66e2c9625a1eb069ca79  outcome_os.py" | sha256sum --check --strict
      - name: Validate
        run: |
          python -m compileall -q outcome_os.py profile_bootstrap.py
          python -m unittest discover -s tests -v
      - name: Commit to main and remove bootstrap
        run: |
          rm .github/workflows/bootstrap-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outcome_os.py .github/workflows/bootstrap-core.yml
          git commit -m "Add verified Outcome OS core"
          git push origin main
